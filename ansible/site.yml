- hosts: frontend
  become: true
  roles:
    - role: frontend
      tags: frontend

- hosts: reverse_proxy
  become: true
  roles:
    - role: reverse_proxy
      tags: reverse_proxy

- hosts: database
  become: true
  roles:
    - role: database
      tags: database

- hosts: backend
  become: true
  vars:
    database_ip: 10.0.2.5
    database_name: "class_schedule"
  roles:
    - role: backend
      tags: backend

- hosts: all
  become: true
  roles:
    - node_exporter

- hosts: monitoring
  vars:
    node_exporter_targets:
      - 10.0.2.3    # frontend
      - 10.0.2.4    # backend
      - 10.0.2.5    # database
      - 10.0.2.6    # reverse_proxy
  tasks:
    - name: Deploy prometheus config with node_exporters
      template:
        src: prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
      notify: Restart Prometheus
      become: true




