- hosts: frontend
  become: true
  roles:
    - role: frontend
      tags: frontend

- hosts: reverse_proxy
  become: true
  roles:
    - role: reverse_proxy
      tags: reverse_proxy

- hosts: database
  become: true
  roles:
    - role: database
      tags: database

- hosts: backend
  become: true
  vars:
    database_ip: 10.0.2.5
    database_name: "class_schedule"
  roles:
    - role: backend
      tags: backend

- hosts: all
  become: true
  roles:
    - node_exporter

- hosts: monitoring
  become: true
  roles:
    - role: monitoring
      tags: monitoring

- hosts: backend,frontend,database,reverse_proxy
  become: true
  vars:
    datadog_api_key: "{{ datadog_api_key }}"
  roles:
    - datadog

