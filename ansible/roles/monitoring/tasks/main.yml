- name: Ensure required packages are installed
  apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - curl
    - gnupg
    - apt-transport-https

- name: Check if Prometheus exists
  stat:
    path: /opt/prometheus/prometheus
  register: prometheus_bin

- name: Create Prometheus user and dirs
  when: not prometheus_bin.stat.exists
  block:
    - name: Add prometheus user
      user:
        name: prometheus
        system: yes
        shell: /bin/false

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: 0755
      loop:
        - /etc/prometheus
        - /opt/prometheus
        - /var/lib/prometheus

- name: Install Prometheus
  when: not prometheus_bin.stat.exists
  unarchive:
    src: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /opt/
    remote_src: yes
    creates: /opt/prometheus/prometheus

- name: Copy Prometheus binaries
  copy:
    remote_src: yes
    src: "/opt/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: 0755
  loop:
    - prometheus
    - promtool

- name: Copy Prometheus config
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: 0644
  notify: Restart Prometheus

- name: Create Prometheus service
  copy:
    dest: /etc/systemd/system/prometheus.service
    content: |
      [Unit]
      Description=Prometheus
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus

      [Install]
      WantedBy=multi-user.target
  notify: Restart Prometheus

- name: Enable and start Prometheus
  systemd:
    name: prometheus
    state: started
    enabled: true

# === Datadog agent installation ===

- name: Add Datadog APT key
  apt_key:
    url: https://keys.datadoghq.com/DATADOG_APT_KEY.public
    state: present

- name: Add Datadog APT repo
  apt_repository:
    repo: "deb https://apt.datadoghq.com/ stable 7"
    state: present
    filename: datadog

- name: Install Datadog agent
  apt:
    name: datadog-agent
    state: present
    update_cache: true

- name: Ensure API key is saved
  copy:
    src: files/datadog-api-key.txt
    dest: "{{ datadog_api_key_path }}"
    mode: 0600

- name: Configure Datadog agent
  copy:
    src: files/datadog.yaml
    dest: /etc/datadog-agent/datadog.yaml
  notify: Restart Datadog

- name: Enable and start Datadog agent
  systemd:
    name: datadog-agent
    state: started
    enabled: true
