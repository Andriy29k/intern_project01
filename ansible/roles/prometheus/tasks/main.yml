- name: Check if Prometheus is installed
  shell: dpkg -s prometheus
  register: prometheus_installed
  failed_when: false
  changed_when: false
  become: true

- name: Install Prometheus if not installed
  apt:
    name: prometheus
    state: present
    update_cache: yes
  when: prometheus_installed.rc != 0
  become: true

- name: Ensure /etc/prometheus directory exists
  file:
    path: /etc/prometheus
    state: directory
    mode: '0755'
  become: true

- name: Deploy prometheus.yml config only if changed
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: '0644'
  register: prometheus_config
  notify:
    - Reload Prometheus
  become: true

- name: Deploy prometheus.service systemd unit only if changed
  template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: '0644'
  register: prometheus_service
  notify:
    - Reload systemd
    - Restart Prometheus
  become: true

- name: Ensure Prometheus service is enabled and running
  systemd:
    name: prometheus
    state: started
    enabled: true
  become: true


