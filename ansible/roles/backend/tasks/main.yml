- name: Ensure Docker is installed
  apt:
    name: docker.io
    state: present
    update_cache: true
  become: true

- name: Ensure Docker service is running and enabled
  systemd:
    name: docker
    state: started
    enabled: true
  become: true

- name: Stop backend container if running
  community.docker.docker_container:
    name: backend
    state: stopped
  ignore_errors: true

- name: Remove backend container if exists
  community.docker.docker_container:
    name: backend
    state: absent
  ignore_errors: true

- name: Remove old backend image if exists
  community.docker.docker_image:
    name: "{{ backend_image }}"
    state: absent
  ignore_errors: true

- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ docker_username }}"
    password: "{{ docker_password }}"

- name: Pull backend Docker image
  community.docker.docker_image:
    name: "{{ backend_image }}"
    source: pull

- name: Run backend container
  community.docker.docker_container:
    name: backend
    image: "{{ backend_image }}"
    state: started
    restart_policy: always
    env:
      DB_ENDPOINT_TOKEN: "{{ database_url }}"
      DB_USERNAME_TOKEN: "{{ db_username_token }}"
      DB_USERPASSWORD_TOKEN: "{{ db_userpassword_token }}"
      REDIS_URL: "{{ redis_url }}"

    ports:
      - "8080:8080"
