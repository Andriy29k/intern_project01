---
- name: Ensure ~/.ssh exists on localhost
  ansible.builtin.file:
    path: "{{ lookup('env','HOME') }}/.ssh"
    state: directory
    mode: '0700'
  delegate_to: localhost

- name: Generate SSH key for bastion access on localhost (if not exists)
  community.crypto.openssh_keypair:
    path: "{{ lookup('env','HOME') }}/.ssh/gcp_id_rsa"
    type: rsa
    size: 4096
    force: false
  delegate_to: localhost

- name: Upload bastion private key to bastion (optional, if you want to copy)
  ansible.builtin.debug:
    msg: "Assuming you already have bastion key locally and use it to connect"

- name: Generate SSH keypair on bastion for access to internal servers
  community.crypto.openssh_keypair:
    path: ~/.ssh/id_rsa_bastion_internal
    type: rsa
    size: 4096
    force: false
  delegate_to: bastion
  become: true
  become_user: andrii

- name: Read public key from bastion internal key
  ansible.builtin.slurp:
    src: ~/.ssh/id_rsa_bastion_internal.pub
  register: bastion_pubkey
  delegate_to: bastion

- name: Set authorized keys on internal servers (frontend, backend, reverse-proxy, database)
  ansible.posix.authorized_key:
    user: andrii
    key: "{{ bastion_pubkey.content | b64decode }}"
  delegate_to: "{{ item }}"
  loop:
    - frontend
    - backend
    - reverse_proxy
    - database

- name: Deploy SSH config on localhost for access via bastion
  ansible.builtin.template:
    src: ssh_config_local.j2
    dest: "{{ lookup('env','HOME') }}/.ssh/config"
    mode: '0600'
  delegate_to: localhost
  vars:
    bastion_ip: "{{ hostvars['bastion'].ansible_host }}"
    internal_hosts:
      - { name: "frontend", ip: "{{ hostvars['frontend'].ansible_host }}" }
      - { name: "backend", ip: "{{ hostvars['backend'].ansible_host }}" }
      - { name: "reverse-proxy", ip: "{{ hostvars['reverse_proxy'].ansible_host }}" }
      - { name: "database", ip: "{{ hostvars['database'].ansible_host }}" }
    bastion_key_path: "~/.ssh/id_rsa_bastion"

- name: Deploy SSH config on bastion for internal access
  ansible.builtin.template:
    src: ssh_config_bastion.j2
    dest: ~/.ssh/config
    mode: '0600'
  delegate_to: bastion
  become: true
  become_user: andrii
  vars:
    internal_hosts:
      - { name: "frontend", ip: "{{ hostvars['frontend'].ansible_host }}" }
      - { name: "backend", ip: "{{ hostvars['backend'].ansible_host }}" }
      - { name: "reverse-proxy", ip: "{{ hostvars['reverse_proxy'].ansible_host }}" }
      - { name: "database", ip: "{{ hostvars['database'].ansible_host }}" }
    internal_key_path: "~/.ssh/id_rsa_bastion_internal"
