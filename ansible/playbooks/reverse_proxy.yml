---
- name: Setup Nginx reverse proxy for frontend
  hosts: reverse_proxy
  become: true

  vars:
    frontend_internal_ip: "10.0.2.2"

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Configure Nginx as reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/frontend
        mode: '0644'
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://{{ frontend_internal_ip }}:3000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Enable frontend site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/frontend
        dest: /etc/nginx/sites-enabled/frontend
        state: link
        force: true

    - name: Remove default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
