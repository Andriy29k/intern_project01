name: App build

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-war:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Gradle 6.8 manually
        run: |
          wget https://services.gradle.org/distributions/gradle-6.8-bin.zip
          unzip gradle-6.8-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-6.8/bin" >> $GITHUB_PATH

      - name: Build WAR with Gradle 6.8
        run: gradle clean war
        working-directory: backend/backend

      - name: Rename WAR file to ROOT.war
        run: mv build/libs/class_schedule.war build/libs/ROOT.war
        working-directory: backend/backend

      - name: Authenticate to GCP Artifact Registry
        env:
          GCP_CREDENTIALS_BASE64: ${{ secrets.GCP_CREDENTIALS_BASE64 }}
        run: |
          echo "$GCP_CREDENTIALS_BASE64" | base64 -d > $HOME/gcp-creds.json
          sudo apt-get update && sudo apt-get install -y google-cloud-sdk
          gcloud auth activate-service-account --key-file=$HOME/gcp-creds.json
          gcloud auth configure-docker us-maven.pkg.dev --quiet

      - name: Upload WAR to GCP Artifact Registry
        run: |
          curl -X PUT -T backend/backend/build/libs/ROOT.war \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://us-maven.pkg.dev/swift-approach-462608-v4/class-schedule/ROOT.war"