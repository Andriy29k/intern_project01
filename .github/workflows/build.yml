name: Build and Deploy

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

env:
  GCP_PROJECT_ID: swift-approach-462608-v4
  BACKEND_BUCKET: backend_artifacts_class_schedule
  FRONTEND_BUCKET: frontend_artifacts_class_schedule

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11

      - name: Install Gradle 6.8
        run: |
          wget https://services.gradle.org/distributions/gradle-6.8-bin.zip
          unzip gradle-6.8-bin.zip -d $HOME
          echo "$HOME/gradle-6.8/bin" >> $GITHUB_PATH

      - name: Build WAR
        run: gradle clean war
        working-directory: backend/backend

      - name: Rename WAR file to ROOT.war
        run: mv build/libs/class_schedule.war build/libs/ROOT.war
        working-directory: backend/backend

      - name: Set up GCP credentials
        env:
          GCP_CREDENTIALS_BASE64: ${{ secrets.GCP_CREDENTIALS_BASE64 }}
        run: |
          echo "$GCP_CREDENTIALS_BASE64" | base64 -d > $HOME/gcp-creds.json
          curl -sSL https://sdk.cloud.google.com | bash > /dev/null
          source $HOME/google-cloud-sdk/path.bash.inc
          gcloud auth activate-service-account --key-file=$HOME/gcp-creds.json
          gcloud auth configure-docker us-maven.pkg.dev --quiet

      - name: Upload WAR to GCP Artifact Registry
        run: |
          curl -u _json_key:"$(cat $HOME/gcp-creds.json)" \
            -T backend/backend/build/libs/ROOT.war \
            "https://us-maven.pkg.dev/$GCP_PROJECT_ID/class-schedule/com/example/class-schedule/1.0.0/ROOT.war"

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js 14.21.3
        run: |
          wget https://nodejs.org/download/release/v14.21.3/node-v14.21.3-linux-x64.tar.xz
          tar -xf node-v14.21.3-linux-x64.tar.xz
          echo "$PWD/node-v14.21.3-linux-x64/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies and build archive
        working-directory: frontend/frontend
        run: |
          npm ci
          cd ..
          tar -czf frontend.tar.gz frontend/node_modules frontend/src frontend/public frontend/package.json frontend/package-lock.json

      - name: Set up GCP credentials
        env:
          GCP_CREDENTIALS_BASE64: ${{ secrets.GCP_CREDENTIALS_BASE64 }}
        run: |
          echo "$GCP_CREDENTIALS_BASE64" | base64 -d > $HOME/gcp-creds.json
          curl -sSL https://sdk.cloud.google.com | bash > /dev/null
          source $HOME/google-cloud-sdk/path.bash.inc
          gcloud auth activate-service-account --key-file=$HOME/gcp-creds.json

      - name: Upload frontend archive to GCP Storage Bucket
        run: |
          gsutil cp frontend.tar.gz gs://$FRONTEND_BUCKET/frontend.tar.gz